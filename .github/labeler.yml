# Backend / Django logic
backend:
  - 'akashic_records/**/*.py'
  - 'accounts/**/*.py'
  - 'books/**/*.py'

# Templates / frontend UI
frontend:
  - 'templates/**/*'
  - 'static/**/*'

# Models
component: models:
  - '*/models.py'

# Views
component: views:
  - '*/views.py'

# Forms
component: forms:
  - '*/forms.py'

# Tests
component: tests:
  - '**/tests/**/*'
  - '**/test_*.py'

# Documentation
component: docs:
  - '*.md'

# Branch-based labels
feature:
  - head-branch: ['feature/**']

bugfix:
  - head-branch: ['fix/**', 'bugfix/**']

refactor:
  - head-branch: ['refactor/**']
