{% if is_paginated %}
        <div class="pagination">
            <div class="pagination-step-links">
                {% if page_obj.has_previous %}
                    <a href="?page={{ page_obj.previous_page_number }}" class="pagination-slide-page rm-a">Prev</a>
                {% endif %}

                <div class="current">
                    Page {{ page_obj.number }} of {{ paginator.num_pages }}.
                </div>

                {% if page_obj.has_next %}
                    <a href="?page={{ page_obj.next_page_number }}" class="pagination-slide-page rm-a">Next</a>
                {% endif %}
            </div>
        </div>
    {% endif %}
