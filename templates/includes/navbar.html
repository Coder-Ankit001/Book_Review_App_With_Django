{% load static %}

<nav class="navbar">
  <div class="nav-container">

    <a class="nav-logo" href="/">
      <span class="logo-symbol">✦</span>
      Akashic Records
    </a>

    <ul class="nav-links">
      <li><a href="{% url 'books:book_list' %}" class="nav-link">Books</a></li>
      <li><a href="{% url 'books:genre_list' %}" class="nav-link">Genres</a></li>
      <li><a href="/" class="nav-link">Beginners</a></li>
      <li><a href="/" class="nav-link">Help</a></li>
    </ul>

    <div class="nav-right">
      <form action="/" method="get" class="nav-search">
        <input type="text" name="q" placeholder="Search the records...">
        <button type="submit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
      </form>

        <div class="nav-auth">
          {% if user.is_authenticated %}
            <div class="nav-user">
              <span class="nav-username">{{ user.username }}</span>
              <form method="POST" action="{% url 'logout' %}">
                  {% csrf_token %}
                  <button type="submit" class="btn btn-danger">Logout</button>
              </form>
            </div>
          {% else %}
            <a href="{% url 'login' %}" class="btn btn-warning">Login</a>
            <a href="{% url 'register' %}" class="btn btn-primary">Register</a>
          {% endif %}
          </div>
    </div>

  </div>
</nav>
